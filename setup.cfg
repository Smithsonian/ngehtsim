# See the docstring in versioneer.py for instructions. Note that you must
# re-run 'versioneer.py setup' after changing this section, and commit the
# resulting files.

[versioneer]
VCS = git
style = pep440
versionfile_source = ngehtsim/_version.py
versionfile_build = ngehtsim/_version.py
tag_prefix =
parentdir_prefix = ngehtsim-

[tool:pytest]
addopts = -ra
testpaths =
    tests
markers =
    slow: long-running synthetic-data/example workflows
    optional: tests requiring optional dependencies
    external_weather: tests requiring an externally distributed local weather dataset
