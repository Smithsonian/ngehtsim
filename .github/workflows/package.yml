name: Verify package build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/package.yml"
      - "pyproject.toml"
      - "setup.py"
      - "setup.cfg"
      - "ngehtsim/__init__.py"
      - "ngehtsim/_version.py"
      - "versioneer.py"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build source and wheel distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify installed wheel version
        run: |
          python -m venv /tmp/ngehtsim-wheel-check
          /tmp/ngehtsim-wheel-check/bin/python -m pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/ngehtsim-wheel-check/bin/python -c 'from importlib.metadata import version; import ngehtsim; assert ngehtsim.__version__ == version("ngehtsim")'
